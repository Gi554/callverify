services:
  web:
    ports: !reset []
  api:
    ports: !reset []
    environment:
      TRUST_PROXY: "true"
  caddy:
    image: caddy:2-alpine
    environment:
      CALLVERIFY_DOMAIN: ${CALLVERIFY_DOMAIN:?Set CALLVERIFY_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
volumes:
  caddy_data:
  caddy_config:
