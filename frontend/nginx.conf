log_format callverify '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
access_log /var/log/nginx/access.log callverify;
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 20m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    resolver 127.0.0.11 valid=30s;
    set $amx_portal http://portal:8000;
    set $amx_assurance http://assurance:8000;
    location /api/portal/ {
        proxy_pass $amx_portal;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/assurance/ {
        proxy_pass $amx_assurance;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/isolation/ {
        rewrite ^/api/isolation/(.*)$ /api/$1 break;
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }
    location /assets/ { expires 30d; }
    location / { try_files $uri $uri/ /index.html; }
}
