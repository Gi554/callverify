services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: callverify
      POSTGRES_USER: callverify
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U callverify"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis:/data
  api:
    build: .
    env_file: ${CALLVERIFY_ENV_FILE:-.env}
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - media:/app/private-media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
  worker:
    build: .
    env_file: ${CALLVERIFY_ENV_FILE:-.env}
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    command: celery -A config worker --loglevel=INFO --concurrency=2
    volumes:
      - media:/app/private-media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
  beat:
    build: .
    env_file: ${CALLVERIFY_ENV_FILE:-.env}
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    command: celery -A config beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
  web:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api
volumes:
  postgres:
  redis:
  media:
