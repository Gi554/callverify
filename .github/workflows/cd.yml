name: Deploy CRM production

on:
  workflow_run:
    workflows: [Validate CRM services]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: crm-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.CD_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Skip superseded commits
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_SHA" =~ ^[a-f0-9]{40}$ ]]
          latest=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
          if [[ "$latest" == "$DEPLOY_SHA" ]]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'A newer main commit exists; this deployment is skipped.'
          fi
      - uses: actions/checkout@v4
        if: steps.current.outputs.deploy == 'true'
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false
      - name: Deploy validated commit over verified SSH
        if: steps.current.outputs.deploy == 'true'
        env:
          SSH_HOST: ${{ vars.CD_HOST }}
          SSH_PORT: ${{ vars.CD_PORT || '22' }}
          SSH_USER: ${{ vars.CD_USER }}
          DEPLOY_PATH: ${{ vars.CD_PATH }}
          SSH_KEY: ${{ secrets.CD_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.CD_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9.-]+$ && "$SSH_HOST" != -* ]]
          [[ "$SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]] && ((10#$SSH_PORT >= 1 && 10#$SSH_PORT <= 65535))
          [[ "$DEPLOY_PATH" =~ ^/[a-zA-Z0-9_/-]+$ && "$DEPLOY_PATH" != / && "$DEPLOY_PATH" != *..* ]]
          [[ -n "$SSH_KEY" && -n "$SSH_KNOWN_HOSTS" ]]
          umask 077
          ssh_dir=$(mktemp -d)
          trap 'rm -rf -- "$ssh_dir"' EXIT
          printf '%s\n' "$SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          ssh -i "$ssh_dir/key" -p "$SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "$SSH_USER@$SSH_HOST" "bash -s -- '$DEPLOY_SHA' '$DEPLOY_PATH'" \
            < scripts/deploy-release.sh
