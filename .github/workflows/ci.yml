name: Validate CRM services
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DEBUG: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lock.txt
      - run: python manage.py test core
      - run: python manage.py test portal.backend.identity --settings=portal.backend.settings
      - run: python manage.py test apps.assurance.backend.crm --settings=apps.assurance.backend.settings
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py makemigrations --check --dry-run --settings=portal.backend.settings
      - run: python manage.py makemigrations --check --dry-run --settings=apps.assurance.backend.settings
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec vue-tsc --noEmit
      - run: pnpm exec vite build
