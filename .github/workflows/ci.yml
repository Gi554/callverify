name: Validate CRM services
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DEBUG: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lock.txt
      - run: python manage.py test core
      - run: python manage.py test portal.backend.identity --settings=portal.backend.settings
      - run: python manage.py test apps.assurance.backend.crm --settings=apps.assurance.backend.settings
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py makemigrations --check --dry-run --settings=portal.backend.settings
      - run: python manage.py makemigrations --check --dry-run --settings=apps.assurance.backend.settings
  assurance-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: amx_assurance
          POSTGRES_USER: amx_test
          POSTGRES_PASSWORD: local-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U amx_test -d amx_assurance"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DEBUG: 'true'
      ASSURANCE_DB_HOST: localhost
      ASSURANCE_DB_NAME: amx_assurance
      ASSURANCE_DB_USER: amx_test
      ASSURANCE_DB_PASSWORD: local-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lock.txt
      - run: python manage.py test apps.assurance.backend.crm --settings=apps.assurance.backend.settings
      - name: Install PostgreSQL 17 client tools
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release; echo "$VERSION_CODENAME")-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17
      - name: Restore an encrypted dump into a disposable PostgreSQL database
        run: PATH="/usr/lib/postgresql/17/bin:$PATH" python -m unittest core.test_crm_pg_backup -v
        env:
          CRM_BACKUP_PG_TEST: '1'
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: amx_test
          PGPASSWORD: local-ci-only
      - run: python manage.py test portal.backend.identity --settings=portal.backend.settings
        env:
          PORTAL_DB_HOST: localhost
          PORTAL_DB_NAME: amx_assurance
          PORTAL_DB_USER: amx_test
          PORTAL_DB_PASSWORD: local-ci-only
      - run: python manage.py test core.test_isolation_work core.test_isolation_bulk core.test_isolation_activity core.test_isolation_visits core.test_isolation_client core.test_isolation_statistics core.test_isolation_statistics_export core.test_isolation_supplements core.test_isolation_sharing core.test_isolation_phone_calls
        env:
          POSTGRES_HOST: localhost
          POSTGRES_DB: amx_assurance
          POSTGRES_USER: amx_test
          POSTGRES_PASSWORD: local-ci-only
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec vue-tsc --noEmit
      - run: pnpm exec vite build
